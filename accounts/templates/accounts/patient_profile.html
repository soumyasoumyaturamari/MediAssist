<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Profile | MediAssist</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f8fb;
            color: #333;
        }

        /* Header */

        .header {
            background: #176b62;
            color: white;
            padding: 18px 40px;

            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            font-size: 25px;
        }

        .logout {
            background: white;
            color: #176b62;

            padding: 9px 18px;

            border-radius: 7px;

            text-decoration: none;

            font-weight: bold;
        }

        .logout:hover {
            background: #e8f5f3;
        }

        /* Main */

        .container {
            width: 700px;
            max-width: 92%;

            margin: 40px auto;
        }

        .profile-card {
            background: white;

            padding: 35px;

            border-radius: 15px;

            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        .profile-card h2 {
            text-align: center;

            color: #176b62;

            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;

            color: #777;

            margin-bottom: 30px;
        }

        /* Success message */

        .success {
            background: #e6f7ef;

            color: #176b62;

            padding: 12px;

            border-radius: 7px;

            margin-bottom: 20px;

            text-align: center;
        }

        /* Form */

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;

            margin-bottom: 7px;

            font-weight: bold;

            color: #333;
        }

        input,
        select,
        textarea {

            width: 100%;

            padding: 12px;

            border: 1px solid #ccc;

            border-radius: 7px;

            font-size: 15px;
        }

        input:focus,
        select:focus,
        textarea:focus {

            outline: none;

            border-color: #176b62;
        }

        textarea {

            resize: vertical;

            min-height: 90px;
        }

        /* Buttons */

        .buttons {

            display: flex;

            gap: 12px;

            margin-top: 25px;
        }

        .save-btn {

            flex: 1;

            padding: 12px;

            background: #176b62;

            color: white;

            border: none;

            border-radius: 7px;

            font-size: 16px;

            cursor: pointer;
        }

        .save-btn:hover {
            background: #12554e;
        }

        .back-btn {

            flex: 1;

            padding: 12px;

            background: #eee;

            color: #333;

            text-decoration: none;

            text-align: center;

            border-radius: 7px;

            font-size: 16px;
        }

        .back-btn:hover {
            background: #ddd;
        }

        /* Responsive */

        @media (max-width: 600px) {

            .header {
                padding: 15px 20px;
            }

            .header h1 {
                font-size: 20px;
            }

            .profile-card {
                padding: 25px;
            }

            .buttons {
                flex-direction: column;
            }
        }

    </style>

</head>

<body>

<!-- Header -->

<div class="header">

    <h1>🩺 MediAssist</h1>

    <a href="{% url 'patient_logout' %}" class="logout">
        Logout
    </a>

</div>


<!-- Profile -->

<div class="container">

    <div class="profile-card">

        <h2>👤 My Profile</h2>

        <p class="subtitle">
            View and update your personal information
        </p>


        {% if success %}

            <div class="success">
                {{ success }}
            </div>

        {% endif %}


        <form method="POST">

            {% csrf_token %}


            <!-- Name -->

            <div class="form-group">

                <label for="name">
                    Full Name
                </label>

                <input
                    type="text"
                    id="name"
                    name="name"
                    value="{{ patient.name }}"
                    required
                >

            </div>


            <!-- Email -->

            <div class="form-group">

                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    value="{{ patient.email }}"
                    required
                >

            </div>


            <!-- Phone -->

            <div class="form-group">

                <label for="phone">
                    Phone Number
                </label>

                <input
                    type="tel"
                    id="phone"
                    name="phone"
                    value="{{ patient.phone }}"
                    maxlength="15"
                    required
                >

            </div>


            <!-- Age -->

            <div class="form-group">

                <label for="age">
                    Age
                </label>

                <input
                    type="number"
                    id="age"
                    name="age"
                    value="{{ patient.age }}"
                    min="1"
                    max="120"
                    required
                >

            </div>


            <!-- Gender -->

            <div class="form-group">

                <label for="gender">
                    Gender
                </label>

                <select id="gender" name="gender" required>

                    <option value="">
                        Select Gender
                    </option>

                    <option value="Male"
                        {% if patient.gender == "Male" %}selected{% endif %}>
                        Male
                    </option>

                    <option value="Female"
                        {% if patient.gender == "Female" %}selected{% endif %}>
                        Female
                    </option>

                    <option value="Other"
                        {% if patient.gender == "Other" %}selected{% endif %}>
                        Other
                    </option>

                </select>

            </div>


            <!-- Address -->

            <div class="form-group">

                <label for="address">
                    Address
                </label>

                <textarea
                    id="address"
                    name="address"
                    required
                >{{ patient.address }}</textarea>

            </div>


            <!-- Buttons -->

            <div class="buttons">

                <button
                    type="submit"
                    class="save-btn"
                >
                    💾 Save Changes
                </button>

                <a
                    href="{% url 'patient_dashboard' %}"
                    class="back-btn"
                >
                    ← Back to Dashboard
                </a>

            </div>

        </form>

    </div>

</div>

</body>
</html>
